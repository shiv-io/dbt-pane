id = "shiv-io.herdr-dbt"
name = "dbt pane"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Side panel for a dbt worktree: changed models, target database and schema, documentation changes, and lineage"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/launch.sh", "build"]

[[actions]]
id = "open"
title = "Open dbt pane"
contexts = ["workspace", "pane"]
command = ["sh", "scripts/launch.sh", "open-split"]

[[actions]]
id = "open-tab"
title = "Open dbt pane in a new tab"
contexts = ["workspace", "pane"]
command = ["sh", "scripts/launch.sh", "open-tab"]

# Herdr starts plugin panes in the plugin folder. dbt-pane reads the focused pane's
# folder from HERDR_PLUGIN_CONTEXT_JSON to find the dbt project in that worktree.
[[panes]]
id = "panel"
title = "dbt"
placement = "split"
command = ["sh", "scripts/launch.sh", "panel"]
