[project]
name = "dbt-pane"
version = "0.1.0"
description = "Terminal panel that shows what a dbt branch changes: models, target, docs, and lineage"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "textual>=3.0",
]

[project.scripts]
dbt-pane = "dbt_pane.app:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_pane"]
